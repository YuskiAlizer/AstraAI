name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          set -e
          xcodebuild \
            -project AstraAI.xcodeproj \
            -scheme AstraAI \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_SKIP_VALIDATION=YES \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            clean build

          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/AstraAI.app build/Payload/
          rm -rf build/Payload/AstraAI.app/_CodeSignature
          cd build
          zip -qry AstraAI-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraAI-unsigned-ipa
          path: build/AstraAI-unsigned.ipa
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Astra AI v1.0.${{ github.run_number }}
          files: build/AstraAI-unsigned.ipa
          body: |
            # Astra AI — Build #${{ github.run_number }}

            ## Installation

            ### Via AltStore / Sideloadly
            1. Téléchargez le fichier `AstraAI-unsigned.ipa`
            2. Utilisez AltStore ou Sideloadly pour signer et installer l'app

            ### Via Xcode
            1. Ouvrez le projet dans Xcode
            2. Sélectionnez votre iPhone connecté
            3. Run (⌘+R)

            Voir le guide complet: DirectInstall/README_DIRECT_INSTALL.md
